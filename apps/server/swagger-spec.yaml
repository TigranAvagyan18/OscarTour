info:
  title: FlowerFinder
  description: FlowerFinder API
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  schemas:
    User:
      type: object
      properties: {}
    ChangePasswordDTO:
      type: object
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
        confirmPassword:
          type: string
      required:
        - oldPassword
        - newPassword
        - confirmPassword
    RegisterPushTokenDTO:
      type: object
      properties:
        pushToken:
          type: string
          nullable: true
    RegisterDTO:
      type: object
      properties:
        mail:
          type: string
        password:
          type: string
        firstName:
          type: string
        lastName:
          type: string
      required:
        - mail
        - password
        - firstName
        - lastName
    AuthenticatedUserResponse:
      type: object
      properties:
        id:
          type: string
        uid:
          type: string
        mail:
          type: string
        role:
          type: string
          enum:
            - admin
            - courier
            - organization
            - operator
            - user
      required:
        - id
        - uid
        - mail
        - role
    AuthenticatedResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthenticatedUserResponse"
        token:
          type: string
      required:
        - user
        - token
    LoginDTO:
      type: object
      properties:
        mail:
          type: string
        password:
          type: string
      required:
        - mail
        - password
    ResetDTO:
      type: object
      properties:
        mail:
          type: string
      required:
        - mail
    ResetPasswordDto:
      type: object
      properties:
        password:
          type: string
      required:
        - password
    CreateFeedbackDTO:
      type: object
      properties: {}
    Feedback:
      type: object
      properties: {}
    AssignCourierToLocationDto:
      type: object
      properties:
        courierId:
          type: string
          description: Courier profile ID
        locationId:
          type: number
          description: Location ID
      required:
        - courierId
        - locationId
    AssignCourierDto:
