  /search:
    get:
      operationId: searchProducts
      summary: Search products
      parameters:
        - name: q
          required: false
          in: query
          description: Search query text
          schema:
            example: rose
            type: string
        - name: productTypes
          required: false
          in: query
          description: Product types to search
          schema:
            type: array
            items:
              type: string
              enum:
                - flower
                - plant
                - accessory
        - name: organizationIds
          required: false
          in: query
          description: Organization IDs to filter
          schema:
            type: array
            items:
              type: number
        - name: tagIds
          required: false
          in: query
          description: Tag IDs to filter
          schema:
            type: array
            items:
              type: number
        - name: minPrice
          required: false
          in: query
          description: Minimum price
          schema:
            example: 10
            type: number
        - name: maxPrice
          required: false
          in: query
          description: Maximum price
          schema:
            example: 100
            type: number
        - name: isFeatured
          required: false
          in: query
          description: Only show featured products
          schema:
            example: false
            type: boolean
        - name: inStock
          required: false
          in: query
          description: Only show in-stock products
          schema:
            example: true
            type: boolean
        - name: seasonal
          required: false
          in: query
          description: Only show seasonal products
          schema:
            example: false
            type: boolean
        - name: type
          required: false
          in: query
          description: Filter by type (flower/plant type)
          schema:
            example: rose
            type: string
        - name: scientificName
          required: false
          in: query
          description: Filter by scientific name (flowers)
          schema:
            example: Rosa
            type: string
        - name: latinName
          required: false
          in: query
          description: Filter by latin name (plants)
          schema:
            example: Monstera deliciosa
            type: string
        - name: bloomSize
          required: false
          in: query
          description: Filter by bloom size (flowers)
          schema:
            example: large
            type: string
        - name: fragranceLevel
          required: false
          in: query
          description: Filter by fragrance level (flowers)
          schema:
            example: strong
            type: string
        - name: occasion
          required: false
          in: query
          description: Filter by occasion (flowers)
          schema:
            example:
              - wedding
              - birthday
            type: array
            items:
              type: string
        - name: isBouquetable
          required: false
          in: query
          description: Only bouquetable flowers
          schema:
            example: true
            type: boolean
        - name: buildable
          required: false
          in: query
          description: Only buildable flowers
          schema:
            example: true
            type: boolean
        - name: minStemLength
          required: false
          in: query
          description: Minimum stem length (flowers, cm)
          schema:
            example: 30
            type: number
        - name: maxStemLength
          required: false
          in: query
          description: Maximum stem length (flowers, cm)
          schema:
            example: 80
            type: number
        - name: minAverageStems
          required: false
          in: query
          description: Minimum average stems (flowers)
          schema:
            example: 5
            type: number
        - name: maxAverageStems
          required: false
          in: query
          description: Maximum average stems (flowers)
          schema:
            example: 14
            type: number
        - name: minVaseLife
          required: false
          in: query
          description: Minimum vase life (flowers, days)
          schema:
            example: 5
            type: number
        - name: maxVaseLife
          required: false
          in: query
          description: Maximum vase life (flowers, days)
          schema:
            example: 14
            type: number
        - name: placement
          required: false
          in: query
          description: Filter by placement (plants)
          schema:
            example: indoor
            type: string
        - name: toxicity
          required: false
          in: query
          description: Filter by toxicity (plants)
          schema:
            example: non-toxic
            type: string
        - name: minHeight
          required: false
          in: query
          description: Minimum height (plants, cm)
          schema:
            example: 10
            type: number
        - name: maxHeight
          required: false
          in: query
          description: Maximum height (plants, cm)
          schema:
            example: 100
            type: number
        - name: minPotSizeDiameter
          required: false
          in: query
          description: Minimum pot size diameter (plants, cm)
          schema:
            example: 10
            type: number
        - name: maxPotSizeDiameter
          required: false
          in: query
          description: Maximum pot size diameter (plants, cm)
          schema:
            example: 30
            type: number
        - name: wateringPerWeek
          required: false
          in: query
          description: Filter by watering per week (plants)
          schema:
            example: 2
            type: number
        - name: material
          required: false
          in: query
          description: Filter by material (accessories)
          schema:
            example: ceramic
            type: string
        - name: dimensions
          required: false
          in: query
          description: Filter by dimensions (accessories)
          schema:
            example: 20x30cm
            type: string
        - name: sortBy
          required: false
          in: query
          description: Sort by
          schema:
            default: relevance
            enum:
              - relevance
              - price_asc
              - price_desc
              - popularity
              - newest
              - name_asc
              - name_desc
            type: string
        - name: page
          required: false
          in: query
          description: Page number
          schema:
            default: 1
            example: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Number of items per page
          schema:
            default: 20
            example: 20
            type: number
        - name: lang
          required: false
          in: query
          description: Language for name (en, nl, de, fr)
          schema:
            example: en
            type: string
      responses:
        "200":
          description: Products found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponseDto"
      tags: &a55
        - Search
