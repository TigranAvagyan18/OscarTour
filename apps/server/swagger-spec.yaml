openapi: 3.0.0
paths:
  /error:
    get:
      operationId: AppController_error
      parameters: []
      responses:
        "200":
          description: ""
  /cache:
    get:
      operationId: AppController_cache
      parameters: []
      responses:
        "200":
          description: ""
  /log-error:
    post:
      operationId: AppController_logMobileError
      parameters: []
      responses:
        "201":
          description: ""
  /socket/connected:
    get:
      operationId: AppController_getConnectedSockets
      parameters: []
      responses:
        "200":
          description: ""
  /socket/user/{userId}:
    get:
      operationId: AppController_getUserSockets
      parameters:
        - name: userId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
  /import-tours:
    get:
      operationId: AppController_importTours
      parameters: []
      responses:
        "200":
          description: ""
  /health:
    get:
      operationId: HealthController_check
      parameters: []
      responses:
        "200":
          description: The Health Check is successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  info:
                    type: object
                    example: &a1
                      database: &a2
                        status: up
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example: {}
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example: *a1
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
        "503":
          description: The Health Check is not successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  info:
                    type: object
                    example: *a1
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example:
                      redis: &a3
                        status: down
                        message: Could not connect
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database: *a2
                      redis: *a3
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
      tags:
        - Health
  /mail/send:
    get:
      operationId: MailController_send
      parameters: []
      responses:
        "200":
          description: ""
  /upload/single:
    post:
      operationId: uploadSingle
      summary: ""
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: ""
      tags: &a4
        - upload
  /upload/multiple:
    post:
      operationId: uploadMultiple
      summary: ""
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: ""
      tags: *a4
  /tours:
    get:
      operationId: getPublishedTours
      summary: ""
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tour"
      tags: &a5
        - Tours
    post:
      operationId: createTour
      summary: ""
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTourDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tour"
      tags: *a5
      security:
        - bearer: []
  /tours/{id}:
    get:
      operationId: getTourById
      summary: ""
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tour"
      tags: *a5
    patch:
      operationId: updateTour
      summary: ""
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTourDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tour"
      tags: *a5
      security:
        - bearer: []
    delete:
      operationId: deleteTour
      summary: ""
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: boolean
      tags: *a5
      security:
        - bearer: []
  /tours/slug/{slug}:
    get:
      operationId: getTourBySlug
      summary: ""
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tour"
      tags: *a5
  /tours/admin/all:
    get:
      operationId: adminGetAllTours
      summary: ""
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tour"
      tags: *a5
      security:
        - bearer: []
  /auth/admin/login:
    post:
      operationId: adminLogin
      summary: ""
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponseDto"
      tags:
        - Admin Auth
info:
  title: FlowerFinder
  description: FlowerFinder API
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    Tour:
      type: object
      properties:
        id:
          type: number
        slug:
          type: string
        title:
          type: string
        shortDescription:
          type: string
        fullDescription:
          type: string
        category:
          type: string
          enum:
            - group
            - private
            - package
        duration:
          type: string
        durationHours:
          type: number
        durationDays:
          type: number
          nullable: true
        price:
          type: number
        priceNote:
          type: string
        originalPrice:
          type: number
          nullable: true
        image:
          type: string
          nullable: true
        gallery:
          type: array
          items:
            type: string
        rating:
          type: number
        reviewCount:
          type: number
        maxGroupSize:
          type: number
        minGroupSize:
          type: number
        languages:
          type: array
          items:
            type: string
        difficulty:
          type: string
          enum:
            - easy
            - moderate
            - challenging
        pickupIncluded:
          type: boolean
        meetingPoint:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        startingPoint:
          type: string
          nullable: true
        departures:
          type: array
          items:
            type: string
        highlights:
          type: array
          items:
            type: string
        included:
          type: array
          items:
            type: string
        excluded:
          type: array
          items:
            type: string
        itinerary:
          type: array
          items:
            type: string
        faq:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        badge:
          type: string
          nullable: true
        isPublished:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - slug
        - title
        - shortDescription
        - fullDescription
        - category
        - duration
        - durationHours
        - price
        - priceNote
        - gallery
        - rating
        - reviewCount
        - maxGroupSize
        - minGroupSize
        - languages
        - difficulty
        - pickupIncluded
        - departures
        - highlights
        - included
        - excluded
        - itinerary
        - faq
        - tags
        - isPublished
        - createdAt
        - updatedAt
    DepartureScheduleDto:
      type: object
      properties:
        days:
          type: string
        times:
          type: array
          items:
            type: string
      required:
        - days
        - times
    ItineraryDayDto:
      type: object
      properties:
        day:
          type: number
        title:
          type: string
        description:
          type: string
        stops:
          type: array
          items:
            type: string
        meals:
          type: array
          items:
            type: string
        accommodation:
          type: string
      required:
        - day
        - title
        - description
        - stops
        - meals
    FaqItemDto:
      type: object
      properties:
        question:
          type: string
        answer:
          type: string
      required:
        - question
        - answer
    CreateTourDto:
      type: object
      properties:
        title:
          type: string
        shortDescription:
          type: string
        fullDescription:
          type: string
        category:
          type: string
          enum: &a6
            - group
            - private
            - package
        duration:
          type: string
        durationHours:
          type: number
        durationDays:
          type: number
        price:
          type: number
        priceNote:
          type: string
          default: per person
        originalPrice:
          type: number
        image:
          type: string
        gallery:
          type: array
          items:
            type: string
        rating:
          type: number
          default: 0
        reviewCount:
          type: number
          default: 0
        maxGroupSize:
          type: number
        minGroupSize:
          type: number
        languages:
          type: array
          items:
            type: string
        difficulty:
          type: string
          enum: &a7
            - easy
            - moderate
            - challenging
        pickupIncluded:
          type: boolean
          default: false
        meetingPoint:
          type: string
        region:
          type: string
        startingPoint:
          type: string
        departures:
          type: array
          items:
            $ref: "#/components/schemas/DepartureScheduleDto"
        highlights:
          type: array
          items:
            type: string
        included:
          type: array
          items:
            type: string
        excluded:
          type: array
          items:
            type: string
        itinerary:
          type: array
          items:
            $ref: "#/components/schemas/ItineraryDayDto"
        faq:
          type: array
          items:
            $ref: "#/components/schemas/FaqItemDto"
        tags:
          type: array
          items:
            type: string
        badge:
          type: string
        isPublished:
          type: boolean
          default: true
      required:
        - title
        - shortDescription
        - fullDescription
        - category
        - duration
        - durationHours
        - price
        - maxGroupSize
        - minGroupSize
        - difficulty
    UpdateTourDto:
      type: object
      properties:
        title:
          type: string
        shortDescription:
          type: string
        fullDescription:
          type: string
        category:
          type: string
          enum: *a6
        duration:
          type: string
        durationHours:
          type: number
        durationDays:
          type: number
        price:
          type: number
        priceNote:
          type: string
          default: per person
        originalPrice:
          type: number
        image:
          type: string
        gallery:
          type: array
          items:
            type: string
        rating:
          type: number
          default: 0
        reviewCount:
          type: number
          default: 0
        maxGroupSize:
          type: number
        minGroupSize:
          type: number
        languages:
          type: array
          items:
            type: string
        difficulty:
          type: string
          enum: *a7
        pickupIncluded:
          type: boolean
          default: false
        meetingPoint:
          type: string
        region:
          type: string
        startingPoint:
          type: string
        departures:
          type: array
          items:
            $ref: "#/components/schemas/DepartureScheduleDto"
        highlights:
          type: array
          items:
            type: string
        included:
          type: array
          items:
            type: string
        excluded:
          type: array
          items:
            type: string
        itinerary:
          type: array
          items:
            $ref: "#/components/schemas/ItineraryDayDto"
        faq:
          type: array
          items:
            $ref: "#/components/schemas/FaqItemDto"
        tags:
          type: array
          items:
            type: string
        badge:
          type: string
        isPublished:
          type: boolean
          default: true
    AdminLoginDto:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    AdminLoginResponseDto:
      type: object
      properties: {}
